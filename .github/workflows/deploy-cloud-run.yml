# Required GitHub Secrets (all must be created in the repo or organisation):
#
#   GCP_PROJECT_ID          - GCP project where the Cloud Run service lives
#   DOCKERHUB_USERNAME      - Docker Hub username or organisation name
#   DOCKERHUB_TOKEN         - Docker Hub access token with permission to push
#   CLOUD_RUN_SERVICE_NAME  - Cloud Run service name (e.g. "weather-api")
#   WIF_PROVIDER            - Workload Identity Federation provider resource name
#   WIF_SERVICE_ACCOUNT     - Workload Identity Federation service account email
#
# App secrets (add as many as your application needs):
#   OWM_API_KEY             - OpenWeatherMap API key

name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/weather-api:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: docker build -t ${{ env.IMAGE }} . && docker push ${{ env.IMAGE }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
          port: 8080
          env_vars: |
            OWM_API_KEY=${{ secrets.OWM_API_KEY }}
