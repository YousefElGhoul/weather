# Required GitHub Secrets (all must be created in the repo or organisation):
#
#   GCP_PROJECT_ID          - GCP project where Artifact Registry & Cloud Run live
#   GAR_REPOSITORY          - Artifact Registry repository name (e.g. "weather")
#   CLOUD_RUN_SERVICE_NAME  - Cloud Run service name (e.g. "weather-api")
#   WIF_PROVIDER            - Workload Identity Federation provider resource name
#   WIF_SERVICE_ACCOUNT     - Workload Identity Federation service account email
#
# App secrets (add as many as your application needs):
#   OWM_API_KEY             - OpenWeatherMap API key

name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/weather-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        run: docker build -t ${{ env.IMAGE }} . && docker push ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          port: 8080
          env_vars: |
            OWM_API_KEY=${{ secrets.OWM_API_KEY }}
